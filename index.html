<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SennaTv Smart</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root {
    --primary: #007bff;
    --primary-dark: #0056b3;
    --bg: #0f0f0f;
    --card-bg: #181818;
    --text: #ffffff;
    --focus: #00aaff;
    --focus-border: #ffff00; /* Amarelo em destaque para facilitar a visão em TVs */
}

* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Roboto, sans-serif;
    overflow-x: hidden;
}

body.menu-active {
    background-color: #000428;
}

/* NAVBAR */
.navbar {
    background: rgba(0,0,0,0.95);
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 60px;
    z-index: 1000;
    border-bottom: 1px solid #222;
}

.logo {
    font-weight: 900;
    color: var(--primary);
    font-size: 20px;
}

.logo span { color: #fff; }

/* BOTÕES E FOCO PARA TV */
button, input, .dash-item, .cat-item, .card, #breadcrumb {
    outline: none !important;
}

/* Destaque visual forte quando selecionado pelo controle remoto */
button:focus, 
input:focus, 
.dash-item:focus, 
.cat-item:focus, 
.card:focus, 
#breadcrumb:focus {
    border: 3px solid var(--focus-border) !important;
    box-shadow: 0 0 15px rgba(255, 255, 0, 0.8) !important;
    transform: scale(1.03);
}

.top-button, .logout-button {
    background: #222;
    color: white;
    border: 1px solid #444;
    padding: 8px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

/* LOGIN */
.login-box {
    width: 90%;
    max-width: 380px;
    margin: 100px auto 0;
    padding: 30px;
    background: #141414;
    border-radius: 12px;
    text-align: center;
    border: 1px solid #333;
}

.login-box h2 { color: var(--primary); margin-bottom: 25px; }

.login-box input {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border-radius: 6px;
    background: #222;
    color: white;
    border: 1px solid #444;
    font-size: 16px;
}

.btn-entrar {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
}

#status {
    min-height: 22px;
    font-size: 14px;
    margin-top: 20px;
    color: #aaa;
}

.status-loading { color: #00aaff !important; }
.status-error { color: #ff5555 !important; }
.status-success { color: #00dd88 !important; }

/* DASHBOARD */
.dashboard {
    display: none;
    padding: 100px 20px 40px;
    max-width: 1200px;
    margin: 0 auto;
    text-align: center;
}

.dash-item {
    display: inline-block;
    width: 280px;
    margin: 15px;
    background: #1c1c1c;
    border: 2px solid #333;
    border-radius: 15px;
    padding: 30px 20px;
    text-align: center;
    cursor: pointer;
    vertical-align: top;
}

.dash-item-icon { font-size: 50px; }

.dash-item span {
    font-weight: bold;
    font-size: 18px;
    display: block;
    margin-top: 15px;
    color: white;
}

/* MAIN AREA */
#mainArea { padding-top: 70px; display: none; }
.search-wrap { padding: 15px 20px; }

.search-input {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #222;
    color: white;
    font-size: 16px;
}

/* CATEGORIAS */
.cat-scroll {
    display: flex;
    overflow-x: auto;
    padding: 10px 20px;
    white-space: nowrap;
}

.cat-item {
    display: inline-block;
    padding: 10px 20px;
    margin-right: 10px;
    background: #222;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
}

.cat-item.active { background: var(--primary); color: white; }

#breadcrumb {
    background: #222;
    margin: 10px 20px;
    border-radius: 8px;
    padding: 12px 15px;
    font-size: 14px;
    color: var(--primary);
    font-weight: bold;
    cursor: pointer;
}

/* GRID */
.grid {
    display: flex;
    flex-wrap: wrap;
    padding: 20px;
}

.card {
    background: var(--card-bg);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid #333;
    margin: 10px;
    width: 160px;
}

.card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
}

.card-title {
    padding: 10px;
    font-size: 13px;
    text-align: center;
    font-weight: 500;
    height: 45px;
    overflow: hidden;
}

/* PLAYER */
.player-wrap {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: none;
    z-index: 2000;
}

video { width: 100%; height: 100%; background: black; }

.btn-back {
    position: absolute;
    top: 20px;
    left: 20px;
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    z-index: 2100;
    cursor: pointer;
    font-weight: bold;
}

.empty-message {
    width: 100%;
    text-align: center;
    padding: 50px 20px;
    color: #aaa;
}

.hidden { display: none !important; }
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">SENNA TV<span>SMART</span></div>
    <button id="btnVoltarDash" class="top-button hidden" onclick="showDashboard()" tabindex="10">MENU PRINCIPAL</button>
    <button id="btnLogout" class="logout-button hidden" onclick="sair()" tabindex="11">SAIR</button>
</div>

<!-- LOGIN -->
<div id="loginArea" class="login-box">
    <h2>Login de Acesso</h2>
    <input type="text" id="user" placeholder="Usuário" autocomplete="off" autocapitalize="none" tabindex="1">
    <input type="password" id="pass" placeholder="Senha" autocomplete="off" tabindex="2">
    <button id="btnEntrar" class="btn-entrar" onclick="conectar()" tabindex="3">ENTRAR</button>
    <p id="status"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard">
    <div class="dash-item" tabindex="4" onclick="abrirCategoria('live')">
        <div class="dash-item-icon">📺</div>
        <span>Canais Ao Vivo</span>
    </div>
    <div class="dash-item" tabindex="5" onclick="abrirCategoria('movie')">
        <div class="dash-item-icon">🎬</div>
        <span>Filmes (VOD)</span>
    </div>
    <div class="dash-item" tabindex="6" onclick="abrirCategoria('series')">
        <div class="dash-item-icon">🎞️</div>
        <span>Séries</span>
    </div>
</div>

<!-- CONTEÚDO -->
<div id="mainArea">
    <div id="breadcrumb" style="display:none;" tabindex="7" onclick="voltarNivelSerie()">⬅ Voltar</div>
    <div class="search-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar por nome..." oninput="filtrarBusca()" tabindex="8">
    </div>
    <div id="catList" class="cat-scroll"></div>
    <div id="mainGrid" class="grid"></div>
</div>

<!-- PLAYER -->
<div id="playerArea" class="player-wrap">
    <button class="btn-back" id="btnFecharPlayer" onclick="fecharPlayer()" tabindex="900">VOLTAR</button>
    <video id="mainVideo" controls autoplay playsinline></video>
</div>

<script>
const SERVIDORES = [
    "https://epics.zip",
    "http://epics.zip"
];

let servidorAtual = SERVIDORES[0];
let allItems = [];
let filteredItems = [];
let seriesData = {};
let currentView = "grid";
let activeSerie = null;
let activeType = "live";
let hlsObj = null;
let loginEmAndamento = false;
let indiceServidor = 0;

const video = document.getElementById("mainVideo");

window.addEventListener("load", function () {
    const user = document.getElementById("user");
    if (user) {
        setTimeout(function () { user.focus(); }, 500);
    }
});

/* TRATAMENTO DE TECLAS E CONTROLE REMOTO */
document.addEventListener("keydown", function (event) {
    const code = event.keyCode || event.which;

    // Enter / OK no controle
    if (code === 13 || code === 23 || event.key === "Enter") {
        const active = document.activeElement;
        if (active && active.id === "user") {
            event.preventDefault();
            document.getElementById("pass").focus();
            return;
        }
        if (active && active.id === "pass") {
            event.preventDefault();
            conectar();
            return;
        }
    }

    // Botão Voltar (ESC, Backspace ou tecla de voltar do Android TV)
    if (code === 27 || code === 8 || code === 4 || event.key === "Escape" || event.key === "Backspace") {
        const player = document.getElementById("playerArea");
        if (player && player.style.display === "block") {
            event.preventDefault();
            fecharPlayer();
            return;
        }
        if (currentView === "episodes") {
            event.preventDefault();
            exibirTemporadas(activeSerie);
            return;
        }
        if (currentView === "seasons") {
            event.preventDefault();
            abrirCategoria("series");
            return;
        }
        const main = document.getElementById("mainArea");
        if (main && main.style.display === "block") {
            event.preventDefault();
            showDashboard();
            return;
        }
    }
});

function mostrarStatus(mensagem, tipo) {
    const status = document.getElementById("status");
    if (!status) return;
    status.innerText = mensagem;
    status.className = "";
    if (tipo === "loading") status.classList.add("status-loading");
    if (tipo === "error") status.classList.add("status-error");
    if (tipo === "success") status.classList.add("status-success");
}

function conectar() {
    if (loginEmAndamento) return;
    const u = document.getElementById("user").value.trim();
    const p = document.getElementById("pass").value;

    if (!u || !p) {
        mostrarStatus("Digite usuário e senha.", "error");
        return;
    }

    loginEmAndamento = true;
    document.getElementById("btnEntrar").disabled = true;
    mostrarStatus("Conectando ao servidor...", "loading");
    indiceServidor = 0;
    tentarServidor(u, p);
}

function tentarServidor(usuario, senha) {
    if (indiceServidor >= SERVIDORES.length) {
        loginEmAndamento = false;
        document.getElementById("btnEntrar").disabled = false;
        mostrarStatus("Não foi possível conectar. Verifique sua conexão.", "error");
        return;
    }

    servidorAtual = SERVIDORES[indiceServidor];
    const url = servidorAtual + "/get.php?username=" + encodeURIComponent(usuario) +
                "&password=" + encodeURIComponent(senha) + "&type=m3u_plus&output=m3u8";

    const xhr = new XMLHttpRequest();
    let finalizado = false;

    xhr.open("GET", url, true);
    xhr.timeout = 25000;

    xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4 || finalizado) return;
        finalizado = true;

        if (xhr.status >= 200 && xhr.status < 300) {
            const resposta = xhr.responseText || "";
            if (!resposta.trim()) {
                tentarProximoServidor(usuario, senha);
                return;
            }
            processar(resposta);
            if (allItems.length === 0) {
                loginEmAndamento = false;
                document.getElementById("btnEntrar").disabled = false;
                mostrarStatus("Servidor sem conteúdos no momento.", "error");
                return;
            }
            loginEmAndamento = false;
            document.getElementById("btnEntrar").disabled = false;
            mostrarStatus("Conectado!", "success");
            setTimeout(showDashboard, 300);
        } else {
            tentarProximoServidor(usuario, senha);
        }
    };

    xhr.onerror = function () {
        if (!finalizado) { finalizado = true; tentarProximoServidor(usuario, senha); }
    };
    xhr.ontimeout = function () {
        if (!finalizado) { finalizado = true; tentarProximoServidor(usuario, senha); }
    };

    try { xhr.send(); } catch (e) {
        if (!finalizado) { finalizado = true; tentarProximoServidor(usuario, senha); }
    }
}

function tentarProximoServidor(usuario, senha) {
    indiceServidor++;
    setTimeout(function () { tentarServidor(usuario, senha); }, 300);
}

function processar(text) {
    allItems = [];
    seriesData = {};
    const lines = text.split(/\r?\n/);

    for (let i = 0; i < lines.length; i++) {
        const linha = lines[i];
        if (linha.indexOf("#EXTINF:") === -1) continue;

        const nextUrl = lines[i + 1];
        const url = nextUrl ? nextUrl.trim() : "";
        if (!url) continue;

        const commaIdx = linha.indexOf(",");
        let nome = commaIdx !== -1 ? linha.substring(commaIdx + 1).trim() : "Sem nome";

        const logoMatch = linha.match(/tvg-logo="([^"]*)"/i);
        const groupMatch = linha.match(/group-title="([^"]*)"/i);

        const logo = logoMatch ? logoMatch[1] : "";
        const group = groupMatch ? groupMatch[1] : "Geral";

        if (url.indexOf("/series/") !== -1) {
            organizarSerie(nome, url, logo, group);
        } else {
            const type = (url.indexOf("/movie/") !== -1) ? "movie" : "live";
            allItems.push({ nome: nome, url: url, logo: logo, group: group, type: type, isParent: false });
        }
    }
}

function organizarSerie(nomeCompleto, url, logo, group) {
    const match = nomeCompleto.match(/(.*?)\s+S?(\d{1,2})[EXx](\d{1,3})/i);
    if (match) {
        const titulo = match[1].trim();
        const temporada = parseInt(match[2], 10);
        const episodio = parseInt(match[3], 10);

        if (!seriesData[titulo]) {
            seriesData[titulo] = { logo: logo, group: group, temporadas: {} };
            allItems.push({ nome: titulo, logo: logo, group: group, type: "series", isParent: true });
        }
        if (!seriesData[titulo].temporadas[temporada]) {
            seriesData[titulo].temporadas[temporada] = [];
        }
        seriesData[titulo].temporadas[temporada].push({ nome: "Episódio " + episodio, num: episodio, url: url });
        seriesData[titulo].temporadas[temporada].sort(function(a, b) { return a.num - b.num; });
    } else {
        allItems.push({ nome: nomeCompleto, url: url, logo: logo, group: group, type: "series", isParent: false });
    }
}

function showDashboard() {
    document.body.classList.add("menu-active");
    document.getElementById("loginArea").classList.add("hidden");
    document.getElementById("mainArea").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    document.getElementById("btnLogout").classList.remove("hidden");
    document.getElementById("btnVoltarDash").classList.add("hidden");
    document.getElementById("breadcrumb").style.display = "none";

    setTimeout(function () {
        const primeiro = document.querySelector(".dash-item");
        if (primeiro) primeiro.focus();
    }, 200);
}

function abrirCategoria(tipo) {
    document.body.classList.remove("menu-active");
    activeType = tipo;
    currentView = "grid";

    filteredItems = allItems.filter(function(item) { return item.type === tipo; });

    document.getElementById("dashboard").style.display = "none";
    document.getElementById("mainArea").style.display = "block";
    document.getElementById("btnVoltarDash").classList.remove("hidden");
    document.getElementById("breadcrumb").style.display = "none";
    document.getElementById("searchInput").value = "";

    const gruposObj = {};
    for (let i = 0; i < filteredItems.length; i++) {
        gruposObj[filteredItems[i].group] = true;
    }
    const grupos = Object.keys(gruposObj).sort();

    renderGroups(grupos);
    render(filteredItems);

    setTimeout(function() {
        const primeiro = document.querySelector(".card");
        if (primeiro) primeiro.focus();
        else document.getElementById("searchInput").focus();
    }, 200);
}

function renderGroups(groups) {
    const container = document.getElementById("catList");
    container.innerHTML = "";

    const todos = document.createElement("div");
    todos.className = "cat-item active";
    todos.tabIndex = 20;
    todos.innerText = "Todos";
    todos.onclick = function() { filterGroup("Todos", todos); };
    container.appendChild(todos);

    for (let i = 0; i < groups.length; i++) {
        (function(groupName, idx) {
            const item = document.createElement("div");
            item.className = "cat-item";
            item.tabIndex = 21 + idx;
            item.innerText = groupName;
            item.onclick = function() { filterGroup(groupName, item); };
            container.appendChild(item);
        })(groups[i], i);
    }
}

function filterGroup(group, element) {
    const items = document.querySelectorAll(".cat-item");
    for (let i = 0; i < items.length; i++) {
        items[i].classList.remove("active");
    }
    element.classList.add("active");

    const lista = (group === "Todos") ? filteredItems : filteredItems.filter(function(item) {
        return item.group === group;
    });

    render(lista);
}

function escapeHTML(texto) {
    return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function render(lista) {
    const container = document.getElementById("mainGrid");
    if (!lista || lista.length === 0) {
        container.innerHTML = '<div class="empty-message">Nenhum conteúdo encontrado.</div>';
        return;
    }

    container.innerHTML = "";
    for (let i = 0; i < lista.length; i++) {
        (function(item, idx) {
            const card = document.createElement("div");
            card.className = "card";
            card.tabIndex = 100 + idx;

            const imagem = item.logo || "https://via.placeholder.com/200x300?text=TV";
            card.innerHTML = '<img src="' + escapeHTML(imagem) + '"><div class="card-title">' + escapeHTML(item.nome) + '</div>';

            const img = card.querySelector("img");
            img.onerror = function() { this.src = "https://via.placeholder.com/200x300?text=TV"; };

            card.onclick = function() { handleClick(item); };
            card.onkeydown = function(e) {
                const code = e.keyCode || e.which;
                if (code === 13 || code === 23 || e.key === "Enter") {
                    e.preventDefault();
                    handleClick(item);
                }
            };
            container.appendChild(card);
        })(lista[i], i);
    }
}

function handleClick(item) {
    if (item.isParent) {
        exibirTemporadas(item.nome);
    } else {
        play(item.url);
    }
}

function exibirTemporadas(titulo) {
    if (!seriesData[titulo]) return;

    activeSerie = titulo;
    currentView = "seasons";
    const container = document.getElementById("mainGrid");
    const temps = Object.keys(seriesData[titulo].temporadas).sort(function(a, b) { return parseInt(a) - parseInt(b); });

    const breadcrumb = document.getElementById("breadcrumb");
    breadcrumb.innerText = "⬅ " + titulo;
    breadcrumb.style.display = "block";

    document.getElementById("catList").innerHTML = "";
    container.innerHTML = "";

    for (let i = 0; i < temps.length; i++) {
        (function(temp, idx) {
            const card = document.createElement("div");
            card.className = "card";
            card.tabIndex = 200 + idx;
            card.innerHTML = '<div style="height:150px;display:flex;align-items:center;justify-content:center;background:#333;font-size:40px;">📂</div>' +
                             '<div class="card-title">Temporada ' + escapeHTML(temp) + '</div>';

            card.onclick = function() { exibirEpisodios(temp); };
            card.onkeydown = function(e) {
                const code = e.keyCode || e.which;
                if (code === 13 || code === 23) { e.preventDefault(); exibirEpisodios(temp); }
            };
            container.appendChild(card);
        })(temps[i], i);
    }
    focarPrimeiroCard();
}

function exibirEpisodios(numTemp) {
    if (!activeSerie || !seriesData[activeSerie]) return;

    currentView = "episodes";
    const container = document.getElementById("mainGrid");
    const eps = seriesData[activeSerie].temporadas[numTemp];

    const breadcrumb = document.getElementById("breadcrumb");
    breadcrumb.innerText = "⬅ " + activeSerie + " > Temp " + numTemp;
    breadcrumb.style.display = "block";
    container.innerHTML = "";

    if (!eps || eps.length === 0) {
        container.innerHTML = '<div class="empty-message">Nenhum episódio encontrado.</div>';
        return;
    }

    for (let i = 0; i < eps.length; i++) {
        (function(ep, idx) {
            const card = document.createElement("div");
            card.className = "card";
            card.tabIndex = 300 + idx;
            card.innerHTML = '<div style="height:100px;display:flex;align-items:center;justify-content:center;background:#222;font-size:30px;">▶️</div>' +
                             '<div class="card-title">' + escapeHTML(ep.nome) + '</div>';

            card.onclick = function() { play(ep.url); };
            card.onkeydown = function(e) {
                const code = e.keyCode || e.which;
                if (code === 13 || code === 23) { e.preventDefault(); play(ep.url); }
            };
            container.appendChild(card);
        })(eps[i], i);
    }
    focarPrimeiroCard();
}

function focarPrimeiroCard() {
    setTimeout(function() {
        const card = document.querySelector("#mainGrid .card");
        if (card) card.focus();
    }, 150);
}

function voltarNivelSerie() {
    if (currentView === "episodes") exibirTemporadas(activeSerie);
    else if (currentView === "seasons") abrirCategoria("series");
}

function filtrarBusca() {
    const termo = document.getElementById("searchInput").value.toLowerCase().trim();
    const resultado = filteredItems.filter(function(item) {
        return item.nome.toLowerCase().indexOf(termo) !== -1;
    });
    render(resultado);
}

function play(url) {
    if (!url) return;

    const player = document.getElementById("playerArea");
    player.style.display = "block";

    if (hlsObj) {
        try { hlsObj.destroy(); } catch (e) {}
        hlsObj = null;
    }

    video.pause();
    video.removeAttribute("src");
    video.load();

    const urlLower = url.toLowerCase();
    const isMp4 = urlLower.indexOf(".mp4") !== -1;

    if (typeof Hls !== "undefined" && Hls.isSupported() && !isMp4) {
        hlsObj = new Hls({ enableWorker: false, lowLatencyMode: false });
        hlsObj.loadSource(url);
        hlsObj.attachMedia(video);
        hlsObj.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play().catch(function(err) { console.log("Autoplay:", err); });
        });
        hlsObj.on(Hls.Events.ERROR, function(event, data) {
            if (data && data.fatal) {
                try { hlsObj.destroy(); } catch(e) {}
                hlsObj = null;
                video.src = url;
                video.load();
                video.play().catch(function(e){});
            }
        });
    } else {
        video.src = url;
        video.load();
        video.play().catch(function(e){});
    }

    setTimeout(function() {
        document.getElementById("btnFecharPlayer").focus();
    }, 200);
}

function fecharPlayer() {
    const player = document.getElementById("playerArea");
    player.style.display = "none";

    try { video.pause(); } catch(e) {}
    if (hlsObj) {
        try { hlsObj.destroy(); } catch(e) {}
        hlsObj = null;
    }
    video.removeAttribute("src");
    video.load();

    setTimeout(focarPrimeiroCard, 100);
}

function sair() {
    allItems = [];
    filteredItems = [];
    seriesData = {};
    if (hlsObj) {
        try { hlsObj.destroy(); } catch(e) {}
        hlsObj = null;
    }
    location.reload();
}
</script>
